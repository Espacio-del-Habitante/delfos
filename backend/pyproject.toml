[project]
name = "delfos-backend"
version = "1.1.0"
description = "Delfos Flask API"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "gunicorn>=23.0.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.0",
    "waitress>=3.0.0",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
