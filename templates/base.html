<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <title>{% block title %}Delfos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  {% block body %}{% endblock %}
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true">
    <div id="toast" class="toast" role="status" hidden>
      <span class="toast__icon" aria-hidden="true"></span>
      <span class="toast__message"></span>
      <button type="button" class="toast__dismiss" aria-label="Cerrar">×</button>
      <span class="toast__progress" aria-hidden="true"></span>
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
